<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Escape</title>

<script>
const TARGET = "https://google.com";

function escapePage(){

  let url = TARGET;

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  try { window.top.location.href = url; return; } catch(e) {}
  try { window.top.location.replace(url); return; } catch(e) {}
  try { window.open(url, "_top"); return; } catch(e) {}
  try { window.open(url, "_self"); return; } catch(e) {}

  window.location.href = url;
}


window.addEventListener("load", escapePage);


escapePage();

</script>

</head>
<body>
</body>
</html>
