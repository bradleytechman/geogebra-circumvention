<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Escape</title>

<style>
:root{
  --bg:#f5f7fb;
  --box:#ffffff;
  --text:#111;
  --button:#2d7dff;
  --button-hover:#1f5fcc;
}

body.dark{
  --bg:#0f172a;
  --box:#1e293b;
  --text:#e5e7eb;
  --button:#3b82f6;
  --button-hover:#2563eb;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.box{
  background:var(--box);
  padding:30px 35px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
  width:320px;
}

input{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  margin-top:10px;
}

button{
  margin-top:15px;
  font-size:20px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:var(--button);
  color:white;
  cursor:pointer;
  width:100%;
}

button:hover{
  background:var(--button-hover);
}

.links{
  margin-top:15px;
  font-size:14px;
}

.links a{
  color:var(--button);
  cursor:pointer;
  text-decoration:none;
  margin:0 6px;
}

.links a:hover{
  text-decoration:underline;
}

  margin-top:15px;
  font-size:13px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>GeoGebra Method V2</h2>

<input id="urlInput" type="text">

<button onclick="escapePage()">Escape</button>

<div class="links">
<a onclick="fill('https://bing.com')">Bing</a> |
<a onclick="fill('https://github.com')">GitHub</a> |
<a onclick="fill('https://artclassv4-eight.vercel.app/search.html')">Art Class</a>
<a onclick="fill('https://chatgpt.com')">ChatGPT</a>
</div>

<div class="modeToggle" onclick="toggleMode()">
Toggle Dark / Light Mode
</div>

</div>

<script>

const DEFAULT_SITE = "https://google.com";

const urlInput = document.getElementById("urlInput");
urlInput.value = DEFAULT_SITE;

urlInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    escapePage();
  }
});

function fill(url){
  urlInput.value = url;
}

function escapePage(){

  let url = urlInput.value.trim();

  if(!url) url = DEFAULT_SITE;

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  try { window.top.location.href = url; return; } catch(e) {}
  try { window.top.location.replace(url); return; } catch(e) {}
  try { window.open(url,"_top"); return; } catch(e) {}
  try { window.open(url,"_self"); return; } catch(e) {}

  window.location.href = url;
}

function toggleMode(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
